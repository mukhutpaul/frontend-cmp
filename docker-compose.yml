services:
  backend:
    build:
      context: ./backend
    container_name: police-backend
    ports:
      - "8090:8090"
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - C:/bdd/document:/bdd/document
      - C:/bdd/images_destination:/bdd/images_destination
      - C:/bdd:/bdd
  frontend:
    build:
      context: .
    container_name: police-frontend
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: police-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: police
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: aba@aba.com
      PGADMIN_DEFAULT_PASSWORD: aba
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata: