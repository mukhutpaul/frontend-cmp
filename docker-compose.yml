services:
  backend:
    build:
      context: ./backend
    container_name: police-backend
    ports:
      - "8090:8090"
    restart: unless-stopped
    mem_limit: 6g
    cpus: "2.0"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms2g
        -Xmx4g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+UseStringDeduplication
        -Dfile.encoding=UTF-8
    volumes:
      - C:/bdd/document:/bdd/document
      - C:/bdd/images_destination:/bdd/images_destination
      - C:/bdd:/bdd
  frontend:
    build:
      context: .
    container_name: police-frontend
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped
